name = "mumusan-workbench"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"
compatibility_date = "2024-12-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "mumusan-workbench-db"
database_id = "mumusan-workbench-db"

# 可选：KV 用于限流（替代 Blob 的 rate limit）
# [[kv_namespaces]]
# binding = "KV"
# id = "mumusan-workbench-kv"
